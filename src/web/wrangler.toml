name = "auth-link-triage-web"
compatibility_date = "2026-09-01"

# Next.js（output: "export"）の静的書き出しを Cloudflare Workers Assets で配信する。
# rictaworks.jp（Worker名 rictaworks-jp）と同じ「Workers Assets配信」方式。
# Pages Functions・_worker.js は使用しないため assets のみのシンプル構成でよい。
[assets]
directory = "./out"

# カスタムドメイン（DNS・証明書はCloudflareが自動作成する）。
# /api/* は src/api 側の env.production.routes がより具体的なパターンとして優先される。
[[routes]]
pattern = "auth-link-triage-ledger-demo.rictaworks.jp"
custom_domain = true
