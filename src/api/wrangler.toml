name = "auth-link-triage-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# 2026-09-13 デスクトップから `wrangler d1 create auth_link_triage_db` を実行し作成済み。
[[d1_databases]]
binding = "DB"
database_name = "auth_link_triage_db"
database_id = "eb55b397-0557-4684-9ba2-b16d55f72ba9"
migrations_dir = "migrations"

# JST 03:00 = UTC 18:00（前日）の日次リセット（requirements.md 20章）。
[triggers]
crons = ["0 18 * * *"]

[env.production]
name = "auth-link-triage-api"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "auth_link_triage_db"
database_id = "eb55b397-0557-4684-9ba2-b16d55f72ba9"
migrations_dir = "migrations"

# src/web 側のカスタムドメイン（auth-link-triage-ledger-demo.rictaworks.jp）と
# 同一オリジン化するため、/api/* のみこちらのWorkerへ振り向ける。
[[env.production.routes]]
pattern = "auth-link-triage-ledger-demo.rictaworks.jp/api/*"
zone_name = "rictaworks.jp"
